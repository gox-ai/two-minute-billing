services:
  postgres:
    image: postgres:17-alpine
    container_name: tmbilling-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: tmbilling
    ports:
      - "${POSTGRES_PORT:?POSTGRES_PORT must be set in .env}:5432"
    volumes:
      - tmbilling_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d tmbilling"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  tmbilling_pgdata:
