# Proxy-only box. Installed as /etc/nginx/conf.d/00-proxy-only.conf (http level).
# Nothing here serves files from disk — see deploy/README.md § 8.

# Any request no location handles finds nothing to serve.
root /nonexistent/nginx-proxy-only;

# Only Cloudflare and the box itself may connect. Every hostname is proxied by Cloudflare.
# Ranges from https://www.cloudflare.com/ips-v4 and /ips-v6 (fetched 2026-10-24).
allow 127.0.0.1;
allow ::1;
allow 173.245.48.0/20;
allow 103.21.244.0/22;
allow 103.22.200.0/22;
allow 103.31.4.0/22;
allow 141.101.64.0/18;
allow 108.162.192.0/18;
allow 190.93.240.0/20;
allow 188.114.96.0/20;
allow 197.234.240.0/22;
allow 198.41.128.0/17;
allow 162.158.0.0/15;
allow 104.16.0.0/13;
allow 104.24.0.0/14;
allow 172.64.0.0/13;
allow 131.0.72.0/22;
allow 2400:cb00::/32;
allow 2606:4700::/32;
allow 2803:f800::/32;
allow 2405:b500::/32;
allow 2405:8100::/32;
allow 2a06:98c0::/29;
allow 2c0f:f248::/32;
deny all;

# HTTPS for the bare IP or an unknown name: refuse the TLS handshake.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
