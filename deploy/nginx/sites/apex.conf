# Docs + marketing site (Nitro on 4201). The only host that also answers for www.
server {
    server_name @DOMAIN@;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
        proxy_pass http://127.0.0.1:4201;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/@DOMAIN@/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/@DOMAIN@/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# Port 80: apex and www both land on https://<apex> in one hop. Cloudflare redirects
# https://www itself; without www here, http://www fell through to the default site.
server {
    listen 80;
    server_name @DOMAIN@ www.@DOMAIN@;
    return 301 https://@DOMAIN@$request_uri;
}
