# Buyer surface: hosted portal + checkout (same Next build as app, on 4101).
# Next sends its own security headers (dashboard/next.config.mjs).
server {
    server_name portal.@DOMAIN@;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Apple Pay domain verification. Stripe re-fetches this per registered domain;
    # a 404 deactivates it and Apple Pay vanishes from checkout with no error.
    # Next serves it via a rewrite onto /api/apple-pay-domain-association.
    location = /.well-known/apple-developer-merchantid-domain-association {
        proxy_pass http://127.0.0.1:4101;
    }

    # Buyer surface only. /portal and /checkout are the hosted pages (both linked off
    # PORTAL_BASE_URL); /_next carries the chunks and RSC payloads; /brands the card
    # marks; /api the CSP report sink.
    location ~ ^/(portal|checkout|_next|api|brands|favicon\.(ico|svg)|apple-touch-icon\.png)(/|$) {
        proxy_pass http://127.0.0.1:4101;
    }

    # The operator dashboard does not exist on this host.
    location / { return 404; }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/portal.@DOMAIN@/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/portal.@DOMAIN@/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = portal.@DOMAIN@) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name portal.@DOMAIN@;
    listen 80;
    return 404; # managed by Certbot
}
