# Engine API (4001), served only under an obscured path prefix. The host and the prefix
# come from deploy/nginx/nginx.local — never commit either.
server {
    server_name @API_HOST@;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location /@API_PREFIX@/ {
        proxy_pass http://127.0.0.1:4001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Without this, every other path falls through to nginx's built-in html root.
    location / { return 404; }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/@API_HOST@/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/@API_HOST@/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = @API_HOST@) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name @API_HOST@;
    listen 80;
    return 404; # managed by Certbot
}
