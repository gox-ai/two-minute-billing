# Operator dashboard (Next on 4101). Next sends its own security headers (dashboard/next.config.mjs).
server {
    server_name app.@DOMAIN@;

    # The buyer surface lives on portal.<domain>.
    location ^~ /portal   { return 404; }
    location ^~ /checkout { return 404; }

    location / {
        proxy_pass http://127.0.0.1:4101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/app.@DOMAIN@/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/app.@DOMAIN@/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = app.@DOMAIN@) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name app.@DOMAIN@;
    listen 80;
    return 404; # managed by Certbot
}
