# Upstream response headers. Installed as /etc/nginx/conf.d/10-proxy-buffers.conf (http level).
# At the 4 KB default the dashboard's headers (5.5 KB, mostly its CSP) got 502 "upstream sent
# too big header" (2026-10-28). verify:security § C2 keeps each route's headers under 8 KB.
proxy_buffer_size 16k;
proxy_buffers 8 16k;
proxy_busy_buffers_size 32k;
