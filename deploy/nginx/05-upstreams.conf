# Installed as /etc/nginx/conf.d/05-upstreams.conf (http level).
# The dashboard runs twice (deploy/pm2/tmbilling-dashboard*.json). 4102 is a backup: nginx sends it
# a request only when 4101 refuses or times out, which is exactly the window of a reload of 4101.
# A refused connection was never sent upstream, so even a POST is safely retried there.
upstream tmb_dashboard {
    server 127.0.0.1:4101 max_fails=1 fail_timeout=3s;
    server 127.0.0.1:4102 backup;
}
