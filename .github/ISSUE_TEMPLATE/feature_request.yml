name: Feature request
description: Ask for something Two Minute Billing does not do yet.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to bill, collect or report, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How it should work, from your side or your customer's side.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: What you do now
      description: Any workaround you use today, and what it costs you.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would like to open a pull request for this, after we agree on the approach.
